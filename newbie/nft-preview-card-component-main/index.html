<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <!-- -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
  <article class="card">
    <div class="card__box-equilibrium">
      <a href="#" class="card__link-img"><img src="images/image-equilibrium.jpg" alt="" class="card__img"></a>
    </div>

    <h1 class="card__title"><a href="#" class="card__title-link">Equilibrium #3429</a></h1>
    <p class="card__text">Our Equilibrium collection promotes balance and calm.</p>

    <div class="u-flex u-align-center u-space-between">
      <div class="u-flex u-align-start u-gap-xs">
        <div><img src="images/icon-ethereum.svg" alt=""></div>
        <p class="u-color-highlight">0.041 ETH</p>
      </div>

      <div class="u-flex u-align-start u-gap-xs">
        <div><img src="images/icon-clock.svg" alt=""></div>
        <p>3 days left</p>
      </div>
    </div>
    <div class="line"></div>

    <div class="u-flex u-align-center u-gap-sm">
      <div><img src="images/image-avatar.png" alt="" class="card__avatar"></div>
      <h2 class="card__subtitle">Creation of <a href="#" class="card__name-creator">Jules Wyvern</a></h2>
    </div>

    <p class="u-text-align-center">Challenge by <a href="https://www.frontendmentor.io?ref=challenge" class="attribution" target="_blank">Frontend Mentor</a></p>
  </article>
</body>
</html>
